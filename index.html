<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Expense Tracker</title>
</head>
<body>
  <h1>My Expense Tracker</h1>
  <p>Yuk, pantau pengeluaranmu setiap hari.</p>

  <h2>Total Pengeluaran</h2>
  <h3 id="total">Rp0</h3>

  <h2>Tambah Pengeluaran</h2>
  <form id="expense-form">
    <label for="item">Nama Pengeluaran</label>
    <input type="text" id="item" placeholder="Contoh: Makan siang" required>

    <label for="amount">Jumlah (Rp)</label>
    <input type="number" id="amount" min="1" placeholder="Contoh: 25000" required>

    <label for="category">Kategori</label>
    <select id="category" required>
      <option value="">Pilih kategori</option>
      <option value="Food">Food</option>
      <option value="Transport">Transport</option>
      <option value="Fun">Fun</option>
    </select>

    <button type="submit">Tambah Pengeluaran</button>
  </form>

  <h2>Daftar Pengeluaran</h2>

  <ul id="expense-list"></ul>

  <h2>Grafik Pengeluaran</h2>
  
  <canvas id="expense-chart"></canvas>
</body>
</html>
